<style>
  :root{ --main:#2b7a4b; }
  * { box-sizing:border-box; }
  body { font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; margin:0; background:#f7f9f8; color:#222; }
  header { background:var(--main); color:#fff; padding:30px 16px; text-align:center; position:relative; }
  header h1 { margin:0 0 6px; font-size:24px; }

  .desc { color:#666; font-size:13px; margin:4px 0 14px 16px; }
  .list { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:700px){ .list{ grid-template-columns:1fr; } }
  .item { background:#fff; border:1px solid #ddd; border-radius:10px; padding:16px; }
  .item h3 { margin:0 0 8px; font-size:15px; }
  .item .links a { display:inline-block; margin:3px 4px 0 0; padding:6px 10px; background:var(--main); color:#fff; border-radius:6px; text-decoration:none; font-size:12px; }
  .item .links a.secondary { background:#888; }
  .empty { color:#999; font-size:13px; padding:14px; background:#fff; border:1px dashed #ccc; border-radius:10px; text-align:center; }
  footer { text-align:center; color:#999; font-size:12px; margin:30px 0; }
</style>
</head>
