const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbxm5gKl5eL2swMBZCfQ7x3ioHVSCKjcVvFRnw9akShjHmxABI6ZuqabwYD6ONr0jmaj/exec";
const QUIZ_ID = "info-quiz01";
// ▲▲▲ ────────────────────────────────────────────── ▲▲▲
// (참고) 같은 Apps Script를 사용하더라도 QUIZ_ID가 다르면 구글 시트에 새 탭이 자동 생성되어 저장됩니다.

function submitToSheet(name, score, correctCount, total, wrongList) {
  const statusEl = document.getElementById('submitStatus');
  if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL.indexOf('PUT_YOUR_WEB_APP_URL_HERE') !== -1) {
    if (statusEl) statusEl.textContent = '※ 결과 저장 기능이 아직 설정되지 않았습니다. (관리자에게 문의)';
    return;
  }
  if (statusEl) statusEl.textContent = '결과 저장 중...';
  fetch(GOOGLE_SHEET_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      quizId: QUIZ_ID,
      name: name || '이름없음',
      score: score,
      correct: correctCount,
      total: total,
      wrongList: wrongList
    })
  }).then(() => {
    if (statusEl) statusEl.textContent = '✅ 결과가 저장되었습니다.';
  }).catch(() => {
    if (statusEl) statusEl.textContent = '⚠ 결과 저장에 실패했습니다. (인터넷 연결을 확인하세요)';
  });
}

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

  const t = line.trim();
  if (t === '') return null; // 빈 줄은 주변 상황에 따라 나중에 결정
  const symbolMatch = /[=(){}\[\]<>:]/.test(t) || /(==|!=|>=|<=|\+=|-=|\*=|\/=|\/\/)/.test(t);
  if (!symbolMatch) return false;
  const hangulMatches = t.match(/[가-힣]/g);
  const hangul = hangulMatches ? hangulMatches.length : 0;
  const ratio = hangul / t.length;
  return ratio < 0.4;
}

function classifyLines(text){
  const lines = text.split('\n');
  let flags = lines.map(isCodeLine);
  // 빈 줄: 앞뒤가 모두 코드면 코드로 간주
  for (let i = 0; i < flags.length; i++) {
    if (flags[i] === null) {
      flags[i] = (flags[i-1] === true && flags[i+1] === true);
    }
  }
  // 스무딩: 양쪽이 코드면 사이에 낀 짧은 줄도 코드로 흡수
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < flags.length; i++) {
      if (flags[i] === false) {
        const prev = i > 0 ? flags[i-1] : null;
        const next = i < flags.length - 1 ? flags[i+1] : null;
        if (prev === true && next === true) flags[i] = true;
      }
    }
  }
  return lines.map((l, i) => ({ line: l, code: flags[i] }));
}

// 분류된 줄들을 일반 텍스트 / <pre><code> 코드블록으로 묶어 HTML 문자열로 변환
function buildHtmlFromLines(text){
  const items = classifyLines(text);
  let html = '';
  let buffer = [];
  let bufferIsCode = null;
  function flush(){
    if (buffer.length === 0) return;
    if (bufferIsCode) {
      html += '<pre><code>' + escapeHtml(buffer.join('\n')) + '</code></pre>';
    } else {
      html += buffer.map(escapeHtml).join('<br>');
    }
    buffer = [];
  }
  items.forEach(({line, code}) => {
    if (bufferIsCode === null) bufferIsCode = code;
    if (code !== bufferIsCode) {
      flush();
      bufferIsCode = code;
    }
    buffer.push(line);
  });
  flush();
  return html;
}

function renderQuestionText(container, text){
  if (text.indexOf('\n') === -1) {
    container.textContent = text;
  } else {
    container.innerHTML = buildHtmlFromLines(text);
  }
}
function renderOptionText(span, text){
  if (text.indexOf('\n') !== -1) {
    span.innerHTML = buildHtmlFromLines(text);
  } else {
    span.textContent = text;
  }
}

const state = {}; // id -> user answer
let gradedOnce = false;
let showWrongOnly = false;

const quizRoot = document.getElementById('quizRoot');
const chapterFilter = document.getElementById('chapterFilter');

// build chapter filter options
const chapters = [...new Set(QUESTIONS.map(q=>q.chapter))];
chapters.forEach(ch=>{
  const opt = document.createElement('option');
  opt.value = ch; opt.textContent = ch;
  chapterFilter.appendChild(opt);
});

function render() {
  quizRoot.innerHTML = '';
  let currentChapter = null;
  const filterVal = chapterFilter.value;

  QUESTIONS.forEach((q, idx) => {
    if (filterVal !== 'all' && q.chapter !== filterVal) return;
    if (showWrongOnly) {
      const graded = state[q.id] !== undefined;
      const correct = graded && gradeQuestion(q, state[q.id]);
      if (!gradedOnce || correct) return;
    }

    if (q.chapter !== currentChapter) {
      currentChapter = q.chapter;
      const h = document.createElement('h2');
      h.className = 'chapter';
      h.textContent = currentChapter;
      quizRoot.appendChild(h);
    }

    const div = document.createElement('div');
    div.className = 'q';
    div.id = 'qdiv_' + q.id;

    const num = document.createElement('div');
    num.className = 'qnum';
    num.innerHTML = (idx+1) + '. <span class="level-badge">' + q.level + '</span>';
    div.appendChild(num);

    const qt = document.createElement('div');
    qt.className = 'qtext';
    renderQuestionText(qt, q.question);
    div.appendChild(qt);

    if (q.diagram) {
      const dg = document.createElement('div');
      dg.className = 'diagram';
      dg.innerHTML = q.diagram;
      div.appendChild(dg);
    }

    if (q.type === 'single' || q.type === 'truefalse') {
      const ol = document.createElement('ol');
      ol.className = 'opts';
      ol.style.listStyle = 'none';
      q.options.forEach((opt, oi) => {
        const li = document.createElement('li');
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'radio';
        input.name = q.id;
        input.value = oi;
        if (state[q.id] === oi) input.checked = true;
        input.addEventListener('change', () => { state[q.id] = oi; updateProgress(); });
        label.appendChild(input);
        const span = document.createElement('span');
        const wrap = document.createElement('span');
        wrap.textContent = (oi+1) + '. ';
        label.appendChild(wrap);
        renderOptionText(span, opt);
        label.appendChild(span);
        li.appendChild(label);
        ol.appendChild(li);
      });
      div.appendChild(ol);
    } else if (q.type === 'multi') {
      const ol = document.createElement('ol');
      ol.className = 'opts';
      ol.style.listStyle = 'none';
      if (!Array.isArray(state[q.id])) state[q.id] = [];
      q.options.forEach((opt, oi) => {
        const li = document.createElement('li');
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.value = oi;
        if (state[q.id].includes(oi)) input.checked = true;
        input.addEventListener('change', () => {
          if (input.checked) state[q.id].push(oi);
          else state[q.id] = state[q.id].filter(v=>v!==oi);
          updateProgress();
        });
        label.appendChild(input);
        const span = document.createElement('span');
        const wrap = document.createElement('span');
        wrap.textContent = (oi+1) + '. ';
        label.appendChild(wrap);
        renderOptionText(span, opt);
        label.appendChild(span);
        li.appendChild(label);
        ol.appendChild(li);
      });
      div.appendChild(ol);
    } else if (q.type === 'short') {
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = '정답을 입력하세요';
      input.value = state[q.id] || '';
      input.addEventListener('input', () => { state[q.id] = input.value; updateProgress(); });
      div.appendChild(input);
    }

    const resultTag = document.createElement('div');
    resultTag.className = 'result-tag';
    resultTag.id = 'result_' + q.id;
    div.appendChild(resultTag);

    const expl = document.createElement('div');
    expl.className = 'explanation';
    expl.id = 'expl_' + q.id;
    expl.textContent = '해설: ' + q.explanation;
    div.appendChild(expl);

    quizRoot.appendChild(div);
  });

  if (gradedOnce) applyGradingStyles();
}

function gradeQuestion(q, userAnswer) {
  if (userAnswer === undefined) return false;
  if (q.type === "single" || q.type === "truefalse") {
    return userAnswer === q.answer;
  }
  if (q.type === "multi") {
    if (!Array.isArray(userAnswer)) return false;
    const a = [...userAnswer].sort().join(",");
    const b = [...q.answer].sort().join(",");
    return a === b;
  }
  if (q.type === "short") {
    const norm = (s) => (s||"").trim().toLowerCase().replace(/\s+/g, "");
    const ua = norm(userAnswer || "");
    if (ua === "") return false;
    return q.answerKeywords.some(k => norm(k) === ua);
  }
  return false;
}

function updateProgress() {
  const answered = QUESTIONS.filter(q => {
    const v = state[q.id];
    if (v === undefined) return false;
    if (Array.isArray(v)) return v.length > 0;
    if (typeof v === 'string') return v.trim() !== '';
    return true;
  }).length;
  document.getElementById('progressText').textContent = answered + ' / ' + QUESTIONS.length + ' 풀이';
  document.getElementById('progressFill').style.width = (answered / QUESTIONS.length * 100) + '%';
}

function applyGradingStyles() {
  let correctCount = 0;
  QUESTIONS.forEach(q => {
    const div = document.getElementById('qdiv_' + q.id);
    if (!div) return;
    const correct = gradeQuestion(q, state[q.id]);
    if (correct) correctCount++;
    div.classList.add('graded');
    div.classList.toggle('correct', correct);
    div.classList.toggle('wrong', !correct);
    const tag = document.getElementById('result_' + q.id);
    if (tag) {
      tag.textContent = correct ? '✅ 정답입니다' : '❌ 오답입니다';
      tag.className = 'result-tag ' + (correct ? 'correct' : 'wrong');
    }
  });
  const score = Math.round(correctCount / QUESTIONS.length * 100);
  const scoreBox = document.getElementById('scoreBox');
  scoreBox.style.display = 'block';
  scoreBox.textContent = '총점: ' + score + '점  (' + correctCount + ' / ' + QUESTIONS.length + ' 문항 정답)';
}

document.getElementById('gradeBtn').addEventListener('click', () => {
  gradedOnce = true;
  showWrongOnly = false;
  render();
  window.scrollTo({top:0, behavior:'smooth'});

  const name = (document.getElementById('studentName').value || '').trim();
  let correctCount = 0;
  const wrongNums = [];
  QUESTIONS.forEach((q, idx) => {
    const isCorrect = gradeQuestion(q, state[q.id]);
    if (isCorrect) correctCount++;
    else wrongNums.push(idx + 1);
  });
  const score = Math.round(correctCount / QUESTIONS.length * 100);
  const wrongList = wrongNums.join(',');
  submitToSheet(name, score, correctCount, QUESTIONS.length, wrongList);
});

document.getElementById('reviewWrongBtn').addEventListener('click', () => {
  if (!gradedOnce) { alert('먼저 채점하기를 눌러주세요.'); return; }
  showWrongOnly = !showWrongOnly;
  document.getElementById('reviewWrongBtn').textContent = showWrongOnly ? '전체 문제 보기' : '틀린 문제만 보기';
  render();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('모든 답안을 초기화하고 다시 푸시겠습니까?')) return;
  Object.keys(state).forEach(k => delete state[k]);
  gradedOnce = false;
  showWrongOnly = false;
  document.getElementById('scoreBox').style.display = 'none';
  document.getElementById('submitStatus').textContent = '';
  document.getElementById('reviewWrongBtn').textContent = '틀린 문제만 보기';
  render();
  updateProgress();
});

chapterFilter.addEventListener('change', render);

// initial render
render();
updateProgress();

// ---- 자동 테스트: 전체 정답 입력 시 100점인지 콘솔에서 확인 ----
function selfTest() {
  const testState = {};
  QUESTIONS.forEach(q => {
    if (q.type === 'single' || q.type === 'truefalse') testState[q.id] = q.answer;
    else if (q.type === 'multi') testState[q.id] = q.answer;
    else if (q.type === 'short') testState[q.id] = q.answerKeywords[0];
  });
  let correct = 0;
  QUESTIONS.forEach(q => { if (gradeQuestion(q, testState[q.id])) correct++; });
  console.log('[자동검수] 전체 정답 입력 시 점수:', Math.round(correct/QUESTIONS.length*100), '점 (', correct, '/', QUESTIONS.length, ')');
}
selfTest();
</script>
