  explanation:"문제 분해로 적절한 것은 '세 개의 각이 있다'와 '세 개의 선분으로 이루어진 다각형이다'이다." },
{ id:"03_01_q5", chapter:"03_01 문제 해결과 알고리즘", type:"single", level:"중하",
  question:"아래 코드를 실행하고 3을 입력하고 다음으로 4를 입력했습니다. 어떤 출력 결과가 나올지 고르세요.\n\n변의개수 = int(input('변의 개수를 입력하세요 : '))\n각의개수 = int(input('각의 개수를 입력하세요 : '))\n\nif 변의개수 == 3:\n    if 각의개수 == 3:\n        print('삼각형입니다.')",
  options:["삼각형입니다.","사각형입니다.","삼각형이 아닙니다.","(출력 없음)"], answer:3,
  explanation:"각의개수가 4이므로 안쪽 if(각의개수==3)이 거짓이 되어 아무것도 출력되지 않는다." },

{ id:"03_02_q4", chapter:"03_02 프로그래밍의 기초이해", type:"single", level:"하",
  question:"파이썬 언어의 특징입니다. 바르게 설명한 것을 고르세요.",
  options:["컴파일러로 번역되어 실행 파일이 생성된다.","다양한 라이브러리가 많이 개발되어 활용도가 높다.","문법이 복잡하고 많은 노력을 해야 배울 수 있다.","실행속도가 C언어보다 빠르고 디버깅하기 어렵다."], answer:1,
  explanation:"파이썬은 다양한 라이브러리가 많이 개발되어 활용도가 높은 언어이다." },
{ id:"03_02_q5a", chapter:"03_02 프로그래밍의 기초이해", type:"short", level:"하",
  question:"파이썬에서 표준 입력 장치(A)는 보통 무엇인가요?",
  answerKeywords:["키보드"],
  explanation:"표준 입력 장치는 키보드이다." },
{ id:"03_02_q5b", chapter:"03_02 프로그래밍의 기초이해", type:"short", level:"하",
  question:"파이썬에서 표준 출력 장치(B)는 보통 무엇인가요?",
  answerKeywords:["모니터"],
  explanation:"표준 출력 장치는 모니터이다." },

{ id:"03_03_q1", chapter:"03_03 변수와 연산", type:"short", level:"하",
  question:"프로그램에서 값을 저장하기 위한 기억 장소(메모리)를 무엇이라고 하는지 입력하세요.",
  answerKeywords:["변수"],
  explanation:"값을 저장하기 위한 기억 장소를 변수라고 한다." },
{ id:"03_03_q2", chapter:"03_03 변수와 연산", type:"single", level:"하",
  question:"변수에 대한 설명 중 바른 것을 고르세요.",
  options:["변수이름을 만들 때 숫자부터 시작할 수 있다.","변수에 저장했던 데이터들에 다시 접근할 수 있다.","변수에 값을 저장할 때 변수의 자료형을 지정해야 한다.","변수 이름으로 예약어를 사용할 수 없다."], answer:3,
  explanation:"파이썬에서 변수 이름으로 예약어(if, for 등)를 사용할 수 없다." },
{ id:"03_03_q3", chapter:"03_03 변수와 연산", type:"single", level:"하",
  question:"다음 중 파이썬의 기본 자료형이 아닌 것은 무엇일까요?",
  options:["정수","실수","문자열","불","문자"], answer:4,
  explanation:"파이썬에는 한 글자만을 위한 별도의 '문자' 자료형이 없으며, 문자열로 다룬다." },
{ id:"03_03_q4", chapter:"03_03 변수와 연산", type:"single", level:"중하",
  question:"다음 중 자료형이 다른 하나를 고르세요.",
  options:["'123'","\"'안녕'이라고 말하지마~\"","\"안녕\"","'True'","False"], answer:4,
  explanation:"①~④는 모두 문자열(str)이지만 ⑤ False는 불(bool) 자료형이다." },
{ id:"03_03_q5", chapter:"03_03 변수와 연산", type:"single", level:"하",
  question:"input() 함수로 입력받은 입력값은 어떤 자료형인지 고르세요.",
  options:["정수","실수","문자열","불"], answer:2,
  explanation:"input() 함수로 입력받은 값은 항상 문자열(str) 자료형이다." },

{ id:"03_03b_q1", chapter:"03_03 변수와 연산2", type:"single", level:"하",

  options:["위 코드는 'Hello, Codle'이 11번 출력된다.","변화식을 통해 조건식에 들어가는 변수에 변화가 생기고, 그로 인해 조건식의 결과로 거짓이 나올 수 있어야 무한 반복에 빠지지 않는다.","초기식, 조건식, 변화식은 while문을 종료시키기 위한 식이다.","변화식이 없다면, i는 계속 0이기 때문에 while문이 종료하지 않고 무한하게 반복된다."], answer:0,

{ id:"03_06a_q3", chapter:"03_06 반복문(while) 1", type:"single", level:"중",
  question:"서로 다른 결과를 출력하는 코드를 고르세요.",
  options:["i=0\nwhile i<10:\n    print('Hello, Codle')\n    i+=1","i=1\nwhile i<20:\n    print('Hello, Codle')\n    i+=i","i=0\nwhile i<50:\n    print('Hello, Codle')\n    i+=5","i=10\nwhile i>0:\n    print('Hello, Codle')\n    i-=1"], answer:1,
  explanation:"①③④는 모두 10번 출력되지만, ②는 i가 1,2,4,8,16으로 변하며 5번만 출력되어 결과가 다르다." },
{ id:"03_06a_q4", chapter:"03_06 반복문(while) 1", type:"single", level:"중하",
  question:"while문을 활용하여 팩토리얼을 구하는 코드입니다. 빈칸에 알맞은 코드를 선택하세요.\n\nn = int(input())\nres = 1\n\nwhile n > 0:\n    res *= n\n    ____\n\nprint(res)",
  options:["n -= 1","n += 1","n == 1","n *= 1"], answer:0,
  explanation:"n을 1씩 감소시켜야 while문이 종료되고 팩토리얼이 올바르게 계산된다." },
{ id:"03_06a_q5", chapter:"03_06 반복문(while) 1", type:"single", level:"중",
  question:"각 자리수를 더해서 출력하는 코드입니다. 그런데 올바르게 동작하지 않습니다. 어떤 부분을 수정해야 할지 고르세요.\n\nn = int(input())\nsum = 0\n\nwhile n != 0:\n    sum += n % 10\n    n /= 10\n\nprint(sum)",
  options:["sum = 0을 sum = 1로 초기화한다.","n != 0을 n == 0으로 수정한다.","n /= 10을 n //= 10으로 수정한다.","sum += n % 10을 sum += n / 10으로 수정한다."], answer:2,
  explanation:"n /= 10은 실수 나눗셈이라 n이 0이 되지 않아 무한 반복에 빠진다. n //= 10으로 정수 나눗셈을 해야 한다." },

{ id:"03_06b_q1", chapter:"03_06 반복문(while) 2", type:"single", level:"하",
  question:"while 문에 대한 다음 설명 중 A에 들어갈 알맞은 말을 고르세요.\n\nwhile 조건:\n    내부 코드\n\n조건이 A 일 동안 내부 코드를 반복 수행합니다.",
  options:["참","거짓"], answer:0,
  explanation:"while문은 조건이 참인 동안 내부 코드를 반복 수행한다." },
{ id:"03_06b_q2", chapter:"03_06 반복문(while) 2", type:"single", level:"중하",
  question:"아래 코드를 실행시킨 결과로 알맞은 것을 고르세요.\n\ni = 0\nwhile i < 10:\n    print(\"Hello, world!\")\n    i += 1",
  options:["'Hello, world!'가 10번 출력된다.","'Hello, world!'가 1번 출력된다.","'Hello, world!'가 5번 출력된다.","출력 내용 없음"], answer:0,
  explanation:"i가 0부터 9까지 총 10번 반복되므로 10번 출력된다." },
{ id:"03_06b_q3", chapter:"03_06 반복문(while) 2", type:"single", level:"중하",
  question:"두 코드가 같은 결과를 얻기 위해서 빈칸에 들어갈 코드를 고르세요.\n\n[for문]\nfor i in range(1,10):\n    print(n,\"*\",i,\"=\",n*i)\n\n[while문]\ni = 1\n____\n    print(n,\"*\",i,\"=\",n*i)\n    i += 1",
  options:["while i > 10:","while i < 10:","while i >= 10:","while i < 1:"], answer:1,
  explanation:"for i in range(1,10)은 i가 1부터 9까지이므로 while i < 10: 이 동일한 조건이다." },
{ id:"03_06b_q4a", chapter:"03_06 반복문(while) 2", type:"single", level:"중하",
  question:"반복문을 중간에 멈추고(종료하고) 싶을 때 활용할 수 있는 키워드는 무엇인가요?",
  options:["break","continue","input","range"], answer:0,
  explanation:"반복문을 완전히 멈추고 빠져나오려면 break를 사용한다." },
{ id:"03_06b_q4b", chapter:"03_06 반복문(while) 2", type:"single", level:"중하",
  question:"반복문을 중간까지만 실행하고 다시 처음(조건 검사)으로 돌아오고 싶을 때 활용할 수 있는 키워드는 무엇인가요?",
  options:["break","continue","input","range"], answer:1,
  explanation:"현재 반복을 건너뛰고 다음 반복으로 넘어가려면 continue를 사용한다." },
{ id:"03_06b_q5", chapter:"03_06 반복문(while) 2", type:"single", level:"중하",

function submitToSheet(name, score, correctCount, total, wrongList) {
  const statusEl = document.getElementById('submitStatus');
  if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL.indexOf('PUT_YOUR_WEB_APP_URL_HERE') !== -1) {
    if (statusEl) statusEl.textContent = '※ 결과 저장 기능이 아직 설정되지 않았습니다. (관리자에게 문의)';
    return;
  }
  if (statusEl) statusEl.textContent = '결과 저장 중...';
  fetch(GOOGLE_SHEET_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      quizId: QUIZ_ID,
      name: name || '이름없음',
      score: score,
      correct: correctCount,
      total: total,
      wrongList: wrongList
    })
  }).then(() => {
    if (statusEl) statusEl.textContent = '✅ 결과가 저장되었습니다.';
  }).catch(() => {
    if (statusEl) statusEl.textContent = '⚠ 결과 저장에 실패했습니다. (인터넷 연결을 확인하세요)';
  });
}

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 코드 줄 자동 감지: 파이썬 코드처럼 보이는 줄을 찾아 <pre><code> 블록으로 묶어준다 ──
function isCodeLine(line){
  const t = line.trim();
  if (t === '') return null; // 빈 줄은 주변 상황에 따라 나중에 결정
  const symbolMatch = /[=(){}\[\]<>:]/.test(t) || /(==|!=|>=|<=|\+=|-=|\*=|\/=|\/\/)/.test(t);
  if (!symbolMatch) return false;
  const hangulMatches = t.match(/[가-힣]/g);
  const hangul = hangulMatches ? hangulMatches.length : 0;
  const ratio = hangul / t.length;
  return ratio < 0.4;
}

function classifyLines(text){
  const lines = text.split('\n');
  let flags = lines.map(isCodeLine);
  // 빈 줄: 앞뒤가 모두 코드면 코드로 간주
  for (let i = 0; i < flags.length; i++) {
    if (flags[i] === null) {
      flags[i] = (flags[i-1] === true && flags[i+1] === true);
    }
  }
  // 스무딩: 양쪽이 코드면 사이에 낀 짧은 줄도 코드로 흡수
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < flags.length; i++) {
      if (flags[i] === false) {
        const prev = i > 0 ? flags[i-1] : null;
        const next = i < flags.length - 1 ? flags[i+1] : null;
        if (prev === true && next === true) flags[i] = true;
      }
    }
  }
  return lines.map((l, i) => ({ line: l, code: flags[i] }));
}

// 분류된 줄들을 일반 텍스트 / <pre><code> 코드블록으로 묶어 HTML 문자열로 변환
function buildHtmlFromLines(text){
  const items = classifyLines(text);
  let html = '';
  let buffer = [];
  let bufferIsCode = null;
  function flush(){
    if (buffer.length === 0) return;
    if (bufferIsCode) {
      html += '<pre><code>' + escapeHtml(buffer.join('\n')) + '</code></pre>';
    } else {
      html += buffer.map(escapeHtml).join('<br>');
    }
    buffer = [];
  }
  items.forEach(({line, code}) => {
    if (bufferIsCode === null) bufferIsCode = code;
    if (code !== bufferIsCode) {
      flush();
      bufferIsCode = code;
    }
    buffer.push(line);
  });
  flush();
  return html;
}

function renderQuestionText(container, text){
  if (text.indexOf('\n') === -1) {
    container.textContent = text;
  } else {
    container.innerHTML = buildHtmlFromLines(text);
  }
}
function renderOptionText(span, text){
  if (text.indexOf('\n') !== -1) {
    span.innerHTML = buildHtmlFromLines(text);
  } else {
    span.textContent = text;
  }
}

const state = {}; // id -> user answer
let gradedOnce = false;
let showWrongOnly = false;

const quizRoot = document.getElementById('quizRoot');
const chapterFilter = document.getElementById('chapterFilter');

// build chapter filter options
const chapters = [...new Set(QUESTIONS.map(q=>q.chapter))];
chapters.forEach(ch=>{
  const opt = document.createElement('option');
  opt.value = ch; opt.textContent = ch;
  chapterFilter.appendChild(opt);
});

function render() {
  quizRoot.innerHTML = '';
  let currentChapter = null;
  const filterVal = chapterFilter.value;

  QUESTIONS.forEach((q, idx) => {
    if (filterVal !== 'all' && q.chapter !== filterVal) return;
    if (showWrongOnly) {
      const graded = state[q.id] !== undefined;
      const correct = graded && gradeQuestion(q, state[q.id]);
      if (!gradedOnce || correct) return;
    }

    if (q.chapter !== currentChapter) {
      currentChapter = q.chapter;
      const h = document.createElement('h2');
      h.className = 'chapter';
      h.textContent = currentChapter;
      quizRoot.appendChild(h);
    }

    const div = document.createElement('div');
    div.className = 'q';
    div.id = 'qdiv_' + q.id;

    const num = document.createElement('div');
    num.className = 'qnum';
    num.innerHTML = (idx+1) + '. <span class="level-badge">' + q.level + '</span>';
    div.appendChild(num);

    const qt = document.createElement('div');
    qt.className = 'qtext';
    renderQuestionText(qt, q.question);
    div.appendChild(qt);

    if (q.diagram) {
      const dg = document.createElement('div');
      dg.className = 'diagram';
      dg.innerHTML = q.diagram;
      div.appendChild(dg);
    }

    if (q.type === 'single' || q.type === 'truefalse') {
      const ol = document.createElement('ol');
      ol.className = 'opts';
      ol.style.listStyle = 'none';
      q.options.forEach((opt, oi) => {
        const li = document.createElement('li');
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'radio';
        input.name = q.id;
        input.value = oi;
        if (state[q.id] === oi) input.checked = true;
        input.addEventListener('change', () => { state[q.id] = oi; updateProgress(); });
        label.appendChild(input);
        const span = document.createElement('span');
        const wrap = document.createElement('span');
        wrap.textContent = (oi+1) + '. ';
        label.appendChild(wrap);
        renderOptionText(span, opt);
        label.appendChild(span);
        li.appendChild(label);
        ol.appendChild(li);
      });
      div.appendChild(ol);
    } else if (q.type === 'multi') {
      const ol = document.createElement('ol');
      ol.className = 'opts';
      ol.style.listStyle = 'none';
      if (!Array.isArray(state[q.id])) state[q.id] = [];
      q.options.forEach((opt, oi) => {
        const li = document.createElement('li');
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.value = oi;
        if (state[q.id].includes(oi)) input.checked = true;
        input.addEventListener('change', () => {
          if (input.checked) state[q.id].push(oi);
          else state[q.id] = state[q.id].filter(v=>v!==oi);
          updateProgress();
        });
        label.appendChild(input);
        const span = document.createElement('span');
        const wrap = document.createElement('span');
        wrap.textContent = (oi+1) + '. ';
        label.appendChild(wrap);
        renderOptionText(span, opt);
        label.appendChild(span);
        li.appendChild(label);
        ol.appendChild(li);
      });
      div.appendChild(ol);
    } else if (q.type === 'short') {
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = '정답을 입력하세요';
      input.value = state[q.id] || '';
      input.addEventListener('input', () => { state[q.id] = input.value; updateProgress(); });
      div.appendChild(input);
    }

    const resultTag = document.createElement('div');
    resultTag.className = 'result-tag';
    resultTag.id = 'result_' + q.id;
    div.appendChild(resultTag);

    const expl = document.createElement('div');
    expl.className = 'explanation';
    expl.id = 'expl_' + q.id;
    expl.textContent = '해설: ' + q.explanation;
    div.appendChild(expl);

    quizRoot.appendChild(div);
  });

  if (gradedOnce) applyGradingStyles();
}

function gradeQuestion(q, userAnswer) {
  if (userAnswer === undefined) return false;
  if (q.type === "single" || q.type === "truefalse") {
    return userAnswer === q.answer;
  }
  if (q.type === "multi") {
    if (!Array.isArray(userAnswer)) return false;
    const a = [...userAnswer].sort().join(",");
    const b = [...q.answer].sort().join(",");
    return a === b;
  }
  if (q.type === "short") {
    const norm = (s) => (s||"").trim().toLowerCase().replace(/\s+/g, "");
    const ua = norm(userAnswer || "");
    if (ua === "") return false;
    return q.answerKeywords.some(k => norm(k) === ua);
  }
  return false;
}

function updateProgress() {
  const answered = QUESTIONS.filter(q => {
    const v = state[q.id];
    if (v === undefined) return false;
    if (Array.isArray(v)) return v.length > 0;
    if (typeof v === 'string') return v.trim() !== '';
    return true;
  }).length;
  document.getElementById('progressText').textContent = answered + ' / ' + QUESTIONS.length + ' 풀이';
  document.getElementById('progressFill').style.width = (answered / QUESTIONS.length * 100) + '%';
}

function applyGradingStyles() {
  let correctCount = 0;
  QUESTIONS.forEach(q => {
    const div = document.getElementById('qdiv_' + q.id);
    if (!div) return;
    const correct = gradeQuestion(q, state[q.id]);
    if (correct) correctCount++;
    div.classList.add('graded');
    div.classList.toggle('correct', correct);
    div.classList.toggle('wrong', !correct);
    const tag = document.getElementById('result_' + q.id);
    if (tag) {
      tag.textContent = correct ? '✅ 정답입니다' : '❌ 오답입니다';
      tag.className = 'result-tag ' + (correct ? 'correct' : 'wrong');
    }
  });
  const score = Math.round(correctCount / QUESTIONS.length * 100);
  const scoreBox = document.getElementById('scoreBox');
  scoreBox.style.display = 'block';
  scoreBox.textContent = '총점: ' + score + '점  (' + correctCount + ' / ' + QUESTIONS.length + ' 문항 정답)';
}

document.getElementById('gradeBtn').addEventListener('click', () => {
  gradedOnce = true;
  showWrongOnly = false;
  render();
  window.scrollTo({top:0, behavior:'smooth'});

  const name = (document.getElementById('studentName').value || '').trim();
  let correctCount = 0;
  const wrongNums = [];
  QUESTIONS.forEach((q, idx) => {
    const isCorrect = gradeQuestion(q, state[q.id]);
    if (isCorrect) correctCount++;
    else wrongNums.push(idx + 1);
  });
  const score = Math.round(correctCount / QUESTIONS.length * 100);
  const wrongList = wrongNums.join(',');
  submitToSheet(name, score, correctCount, QUESTIONS.length, wrongList);
});

document.getElementById('reviewWrongBtn').addEventListener('click', () => {
  if (!gradedOnce) { alert('먼저 채점하기를 눌러주세요.'); return; }
  showWrongOnly = !showWrongOnly;
  document.getElementById('reviewWrongBtn').textContent = showWrongOnly ? '전체 문제 보기' : '틀린 문제만 보기';
  render();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('모든 답안을 초기화하고 다시 푸시겠습니까?')) return;
  Object.keys(state).forEach(k => delete state[k]);
  gradedOnce = false;
  showWrongOnly = false;
  document.getElementById('scoreBox').style.display = 'none';
  document.getElementById('submitStatus').textContent = '';
  document.getElementById('reviewWrongBtn').textContent = '틀린 문제만 보기';
  render();
  updateProgress();
});

chapterFilter.addEventListener('change', render);

// initial render
render();
updateProgress();

// ---- 자동 테스트: 전체 정답 입력 시 100점인지 콘솔에서 확인 ----
function selfTest() {
  const testState = {};
  QUESTIONS.forEach(q => {
    if (q.type === 'single' || q.type === 'truefalse') testState[q.id] = q.answer;
    else if (q.type === 'multi') testState[q.id] = q.answer;
    else if (q.type === 'short') testState[q.id] = q.answerKeywords[0];
  });
  let correct = 0;
  QUESTIONS.forEach(q => { if (gradeQuestion(q, testState[q.id])) correct++; });
  console.log('[자동검수] 전체 정답 입력 시 점수:', Math.round(correct/QUESTIONS.length*100), '점 (', correct, '/', QUESTIONS.length, ')');
}
selfTest();
</script>
